<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Articole și Resurse | Cabinet Asistență Socială Cristina Dumitran</title>
  <meta name="description" content="Articole, noutăți și resurse din domeniul asistenței sociale, redactate de Cristina Dumitran." />
  <link rel="canonical" href="https://www.domain.ro/articole/index.html" />
  <link rel="icon" type="image/x-icon" href="/cabinetAsistentaSociala/favicon/favicon.ico" />
  <link rel="stylesheet" href="/cabinetAsistentaSociala/css/style.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Salt la conținutul principal</a>
  
  <div id="header-placeholder"></div>
  
  <main id="main-content">
    <div class="page-header">
      <div class="container" style="text-align: center;">
        <h1>Articole și Resurse</h1>
        <p>Informații utile și noutăți din asistența socială.</p>
      </div>
    </div>
    
    <div class="container content-wrapper">
      <div id="articles-container" class="grid" style="grid-template-columns: 1fr; gap: var(--spacing-lg);">
        <p>Se încarcă articolele...</p>
      </div>
    </div>
  </main>
  
  <div id="footer-placeholder"></div>
  
  <script src="/cabinetAsistentaSociala/js/main.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('articles-container');
      try {
        const res = await fetch('lista-articole.json?v=' + new Date().getTime());
        if (!res.ok) throw new Error('Nu am putut încărca articolele.');
        const data = await res.json();
        const articole = data.articole_list || [];
        
        container.innerHTML = '';
        if (articole.length === 0) {
          container.innerHTML = '<p>În curând vom publica primul nostru articol. Vă rugăm să reveniți!</p>';
          return;
        }

        articole.forEach(art => {
          const articleEl = document.createElement('article');
          articleEl.className = 'card';
          articleEl.style.padding = 'var(--spacing-md)';
          articleEl.style.borderLeft = '4px solid var(--color-primary)';
          
          articleEl.innerHTML = `
            <h2 style="margin-bottom: var(--spacing-sm);"><a href="articol.html?id=${art.id}">${art.title}</a></h2>
            <p style="color: var(--color-text-light); font-size: 0.9em; margin-bottom: var(--spacing-sm);">
              Publicat pe: ${art.date}
            </p>
            <p>${art.description}</p>
            <a href="articol.html?id=${art.id}" style="display: inline-block; margin-top: var(--spacing-sm); font-weight: bold;">Citește articolul integral →</a>
          `;
          container.appendChild(articleEl);
        });
      } catch (e) {
        container.innerHTML = '<p>A apărut o eroare la afișarea articolelor. Vă rugăm reveniți mai târziu.</p>';
        console.error(e);
      }
    });
  </script>
</body>
</html>
